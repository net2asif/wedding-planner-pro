let state;let page='overview',search='',filter='All',calCursor=new Date(),mobOpen=false;
function load(){try{let d=localStorage.getItem(KEY);if(d){let s=JSON.parse(d);if(validate(s)){state=s;return}}}catch(e){console.warn('Storage could not be loaded',e)}state=seed()}
function validate(s){return s&&s.version===1&&Array.isArray(s.events)&&Array.isArray(s.guests)&&Array.isArray(s.tables)&&Array.isArray(s.budget)&&Array.isArray(s.vendors)&&Array.isArray(s.tasks)&&Array.isArray(s.timeline)&&s.events.length<=500&&s.guests.length<=15000}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){toast('Could not save in this browser. Export a JSON backup.');return false}}
function currentEvent(){let e=state.events.find(x=>x.id===state.selectedEventId);if(!e){state.selectedEventId=state.events[0]?.id||'';e=state.events[0]}return e}
const records=(name)=>state[name].filter(x=>x.eventId===state.selectedEventId);
const money=(n)=>{let cur=currentEvent()?.currency||'USD';try{return new Intl.NumberFormat('en-US',{style:'currency',currency:cur,maximumFractionDigits:0}).format(safe(n))}catch{return `${cur} ${Math.round(safe(n)).toLocaleString()}`}};
function plain(n){return Number(safe(n)).toLocaleString('en-US')}
function pct(a,b){return b>0?Math.round((a/b)*100):0}
function metrics(){let b=records('budget'),g=records('guests'),t=records('tasks'),v=records('vendors');return {planned:total(b,'planned'),committed:total(b,'actual'),paid:total(records('payments'),'paid'),limit:safe(currentEvent()?.budget),invited:total(g,'party'),confirmed:total(g.filter(x=>x.rsvp==='Confirmed'),'party'),pending:total(g.filter(x=>x.rsvp==='Pending'),'party'),declined:total(g.filter(x=>x.rsvp==='Declined'),'party'),taskDone:t.filter(x=>x.status==='Done').length,taskTotal:t.length,overdue:t.filter(x=>x.status!=='Done'&&x.due&&daysUntil(x.due)<0).length,vendors:v.length}}
function pill(t){return `<span class="pill ${({'Confirmed':'green','Done':'green','Booked':'green','Paid':'green','In progress':'purple','Pending':'yellow','To do':'yellow','In discussion':'yellow','High':'red','Declined':'red','Cancelled':'red','Normal':'gray','Low':'gray'})[t]||'gray'}">${esc(t)}</span>`}
function button(label,action,cls='',attrs=''){return `<button type="button" class="btn ${cls}" data-action="${action}" ${attrs}>${label}</button>`}
function empty(title,desc,action){return `<div class="empty"><div class="empty-icon">✦</div><b>${title}</b><p>${desc}</p>${action?button(`${icon('plus',14)} Add first record`,'add-'+action,'primary'):''}</div>`}
function pageTitle(kicker,title,desc,actions=''){return `<div class="page-title"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><p>${desc}</p></div><div class="page-tools">${actions}</div></div>`}
function render(){let e=currentEvent();document.getElementById('sidebar').innerHTML=`<div class="brand"><span class="brand-mark">${icon('sparkle',23)}</span><div><div class="brand-name">Ever After<span style="color:#8FB8A0">.</span></div><div class="brand-sub">Wedding edition</div></div></div><div class="nav-heading">Workspace</div>${NAV.map(([key,text,ico],i)=>`${i===11?'<div class="nav-heading">Your files</div>':''}<button class="nav-btn ${page===key?'active':''}" data-action="navigate" data-page="${key}">${icon(ico,18)}<span>${text}</span>${page===key?icon('chevron',14):''}</button>`).join('')}<div class="sidebar-bottom"><div class="storage-note">${icon('shield',20)}<span><b>Private by design</b><br>Stored locally on this device. Download JSON backups often.</span></div><div class="side-footer">Wedding Planner Pro · Light Edition</div></div>`;document.getElementById('sidebar').classList.toggle('open',mobOpen);document.getElementById('topbar').innerHTML=`<div class="breadcrumb">MY WORKSPACE &nbsp; / &nbsp; <strong>${NAV.find(x=>x[0]===page)?.[1]}</strong></div><div class="top-actions"><button class="btn icononly toggle-mobile" aria-label="Open navigation" data-action="menu">${icon('menu')}</button><select aria-label="Current event" class="control select-event" id="event-switch">${state.events.map(x=>`<option value="${esc(x.id)}" ${x.id===state.selectedEventId?'selected':''}>${esc(x.name)}</option>`).join('')}</select>${button(`${icon('download',15)} <span class="hide-small">Excel</span>`,'xlsx','soft')}${button(`${icon('plus',15)} <span class="hide-small">New wedding</span>`,'add-event','primary')}${button(icon('download',16),'backup','icononly hide-small','aria-label="Download backup" title="Download backup"')}</div>`;let body={overview:overview,budget:budgetView,payments:paymentsView,guests:guestsView,seating:seatingView,vendors:vendorsView,tasks:tasksView,timeline:timelineView,party:partyView,gifts:giftsView,calendar:calendarView,reports:reportsView,settings:settingsView}[page];document.getElementById('content').innerHTML=body?body():'';}
function stat(title,value,hint,ico,col){return `<div class="stat-card"><div class="stat-icon ${col}">${icon(ico,19)}</div><div class="stat-label">${title}</div><div class="stat-value">${value}</div><div class="stat-hint">${hint}</div></div>`}
function monthBars(){let b=records('budget'),sums={};for(let n=0;n<6;n++){let d=new Date();d.setMonth(d.getMonth()+n);const key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;sums[key]={month:d.toLocaleString('en-US',{month:'short'}),amount:0}}for(let r of b){let k=(r.due||'').slice(0,7);if(sums[k])sums[k].amount+=safe(r.actual)}let values=Object.values(sums),max=Math.max(1,...values.map(v=>v.amount));return `<div class="bar-chart">${values.map(v=>`<div class="chart-col" title="${money(v.amount)}"><div class="bar" style="height:${Math.max(3,v.amount/max*125)}px"></div><span class="chart-month">${v.month}</span></div>`).join('')}</div>`}
function donut(values,colors){let t=values.reduce((a,b)=>a+b,0);if(!t)return 'conic-gradient(#e7ede7 0 100%)';let acc=0;return `conic-gradient(${values.map((v,i)=>{let from=acc;acc+=v/t*100;return `${colors[i%colors.length]} ${from}% ${acc}%`}).join(',')})`}
function overview(){let e=currentEvent(),m=metrics(),day=daysUntil(e.date),tasks=records('tasks').filter(x=>x.status!=='Done').sort((a,b)=>(a.due||'').localeCompare(b.due||'')).slice(0,4),items=records('budget'),categories={};items.forEach(x=>categories[x.category]=(categories[x.category]||0)+safe(x.actual));let entries=Object.entries(categories).sort((a,b)=>b[1]-a[1]).slice(0,5),colors=['#70A889','#DBA280','#A9A0C6','#C9B06E','#8CB8CF'];return `${pageTitle('Your wedding command center','The beautiful details, all in one place.','Plan with clarity, celebrate with joy, and keep every detail beautifully on track.')}
<div class="hero"><div class="hero-orb"></div><div class="hero-floral" aria-hidden="true">❦</div><div class="hero-text"><div class="event-pill">${icon('sparkle',12)} ${esc(e?.type||'Your event')} · ${fmtDate(e?.date)}</div><h1>${esc(e?.name||'Your wedding day')}</h1><p>${esc(e?.description||'Make room for the moments that matter.')} ${e?.location?' · '+esc(e.location):''}</p>${button('View your checklist '+icon('arrow',16),'navigate','primary','data-page="tasks"')}</div><div class="hero-stats"><div class="eyebrow">The countdown</div><div class="days-big">${day===null?'—':Math.abs(day)}</div><div class="days-caption">${day===null?'Add a wedding date':day>0?'days until the celebration':day===0?'Today is your day!':'days since the event'}</div><div class="rule"></div><div class="hero-stat-bottom"><span>Planning progress</span><b>${pct(m.taskDone,m.taskTotal)}% complete</b></div><div class="progress" style="margin-top:8px"><div class="progress-fill" style="width:${Math.min(100,pct(m.taskDone,m.taskTotal))}%"></div></div></div></div>
<div class="stats-grid">${stat('Wedding budget',money(m.limit),`${money(m.limit-m.committed)} uncommitted`,'wallet','sage')}${stat('Confirmed guests',plain(m.confirmed),`${m.pending} pending responses`,'users','peach')}${stat('Tasks completed',`${m.taskDone}/${m.taskTotal}`,`${m.overdue} overdue items`,'check','purple')}${stat('Vendor partners',plain(m.vendors),'Contact details in one place','briefcase','gold')}</div>
${insights()}
<div class="quick-row">${[['Add a guest','Keep RSVPs up to date','users','add-guest'],['Record a cost','Protect your budget','wallet','add-budget'],['New task','Move the plan forward','check','add-task']].map(([t,d,i,a])=>`<button class="quick-tile" data-action="${a}"><div class="quick-icon">${icon(i,20)}</div><div><b>${t}</b><span>${d}</span></div>${icon('plus',15)}</button>`).join('')}</div>
<div class="two-col"><div class="panel"><div class="panel-head"><div><h3>Financial snapshot</h3><span class="sub">Committed costs by upcoming due month</span></div>${button('Details '+icon('chevron',13),'navigate','small','data-page="budget"')}</div><div class="calc-line"><span>Committed to date</span><b>${money(m.committed)}</b></div><div class="progress"><div class="progress-fill" style="width:${Math.min(100,pct(m.committed,m.limit))}%;background:${m.committed>m.limit?'#bb7168':'var(--sage)'}"></div></div>${monthBars()}<div class="legend-row" style="margin-top:18px"><span><i style="background:#70A889"></i>${money(m.paid)} paid</span><span><i style="background:#E9C8B4"></i>${money(Math.max(0,m.committed-m.paid))} outstanding</span></div></div>
<div class="panel"><div class="panel-head"><h3>RSVP overview</h3>${button('Guest list '+icon('chevron',13),'navigate','small','data-page="guests"')}</div><div class="donut-line"><div class="donut" style="background:${donut([m.confirmed,m.pending,m.declined],['#76AB8C','#F2BF9E','#AEA7CF'])}"><div class="donut-center">${m.invited}<small>invited seats</small></div></div><div class="legend-list"><div class="legend-item"><span><i class="swatch" style="background:#76AB8C"></i>Confirmed</span><b>${m.confirmed}</b></div><div class="legend-item"><span><i class="swatch" style="background:#F2BF9E"></i>Awaiting reply</span><b>${m.pending}</b></div><div class="legend-item"><span><i class="swatch" style="background:#AEA7CF"></i>Declined</span><b>${m.declined}</b></div></div></div><div class="section-note" style="margin:20px 0 0;background:#faf9f4;border-color:#f1eee4">Guest counts include everyone in each party, not just the primary guest.</div></div></div>
<div class="two-col"><div class="panel"><div class="panel-head"><h3>What needs your attention</h3>${button('All tasks '+icon('chevron',13),'navigate','small','data-page="tasks"')}</div>${tasks.length?`<div class="mini-list">${tasks.map(x=>`<div class="mini-item"><div class="mini-circle">${icon('check',16)}</div><div><strong>${esc(x.title)}</strong><span>${fmtDate(x.due)}</span></div><div class="right">${pill(x.priority)}</div></div>`).join('')}</div>`:empty('All caught up','Add a task to keep planning moving.','task')}</div><div class="panel"><div class="panel-head"><h3>Budget by category</h3><span class="sub">Committed amounts</span></div>${entries.length?`<div class="category-rail">${entries.map(([k,v],i)=>`<i style="background:${colors[i]};width:${pct(v,m.committed)}%" title="${esc(k)}"></i>`).join('')}</div><div class="legend-list">${entries.map(([k,v],i)=>`<div class="legend-item"><span><i class="swatch" style="background:${colors[i]}"></i>${esc(k)}</span><b>${money(v)}</b></div>`).join('')}</div>`:empty('No budget items','Track a planned expense to see its share.','budget')}</div></div>`}
function tableHeader(t){return `<thead><tr>${t.map(x=>`<th>${x}</th>`).join('')}</tr></thead>`}
function actionCell(type,x){return `<div class="td-actions">${button(icon('edit',14),'edit-'+type,'small','data-id="'+esc(x.id)+'" title="Edit" aria-label="Edit"')}${button(icon('trash',14),'delete-'+type,'small danger','data-id="'+esc(x.id)+'" title="Delete" aria-label="Delete"')}</div>`}
function tools(type,placeholder,withFilter=''){return `<div class="table-tools"><input aria-label="Search records" id="list-search" placeholder="Search ${placeholder}..." value="${esc(search)}">${withFilter?`<select id="list-filter" aria-label="Filter">${['All',...withFilter.split('|')].map(x=>`<option ${filter===x?'selected':''}>${esc(x)}</option>`).join('')}</select>`:''}<span class="spacer"></span>${button(`${icon('plus',14)} Add ${type==='budget'?'expense':type}`,'add-'+type,'primary')}${button(`${icon('download',14)} CSV`,'csv','',`data-section="${type}"`)}</div>`}
function matches(r){return Object.values(r).some(v=>typeof v==='string'&&v.toLowerCase().includes(search.toLowerCase()))}
function budgetView(){let m=metrics(),rows=records('budget').filter(matches).sort((a,b)=>(a.due||'').localeCompare(b.due||''));return `${pageTitle('The financial picture','Budget & expenses','Clear visibility of what you planned, what you committed to spend, and what has actually been paid.',button(icon('printer',15)+' Print','print'))}<div class="col-3">${stat('Budget ceiling',money(m.limit),'Set in Wedding settings','wallet','sage')}${stat('Committed costs',money(m.committed),`${money(m.limit-m.committed)} left to commit`,'chart','peach')}${stat('Still to pay',money(m.committed-m.paid),`${money(m.paid)} paid so far`,'clock','purple')}</div><div class="section-note">Financial definitions: <b>Planned</b> = initial estimate; <b>Committed</b> = agreed cost; <b>Paid</b> = linked payment ledger entries. Vendor quotes are reference only. Use <b>Payment schedule</b> to record money actually paid.</div>${tools('budget','budget items')}<div class="table-wrap"><table>${tableHeader(['Expense / item','Category','Planned','Committed','Paid via schedule','Outstanding','Due date','Actions'])}<tbody>${rows.map(x=>`<tr><td class="strong">${esc(x.item)}</td><td>${esc(x.category)}</td><td>${money(x.planned)}</td><td>${money(x.actual)}</td><td>${money(paidForBudget(x.id))}</td><td>${money(safe(x.actual)-paidForBudget(x.id))}</td><td>${fmtDate(x.due)}</td><td>${actionCell('budget',x)}</td></tr>`).join('')}</tbody></table></div>${rows.length?'':empty('No matching budget items','Try a different search or add an expense.','budget')}`}
function guestsView(){let m=metrics(),rows=records('guests').filter(matches).filter(x=>filter==='All'||x.rsvp===filter);return `${pageTitle('Every guest matters','Guests & RSVPs','One place for your invitation list, dietary notes, party sizes, and response tracking.') }<div class="col-3">${stat('Total invited',plain(m.invited),'Including additional party members','users','sage')}${stat('Attending',plain(m.confirmed),'Confirmed people','heart','peach')}${stat('Awaiting reply',plain(m.pending),'Follow up ahead of the event','clock','purple')}</div>${tools('guest','guests','Confirmed|Pending|Declined')}<div class="table-wrap"><table>${tableHeader(['Guest','Group','Invite','Party size','RSVP','Meal / diet','Seated at','Actions'])}<tbody>${rows.map(x=>`<tr><td class="strong">${esc(x.name)}<div class="muted" style="font-size:10px">${esc(x.email||'')}</div></td><td>${esc(x.group)}</td><td>${pill(x.invitation||'Not sent')}</td><td>${plain(x.party)}</td><td>${pill(x.rsvp)}</td><td>${esc(x.meal&&x.meal!=='Not selected'?x.meal+(x.diet?' · '+x.diet:''):x.diet||'—')}</td><td>${esc(records('tables').find(t=>t.id===x.tableId)?.name||'Unassigned')}</td><td>${actionCell('guest',x)}</td></tr>`).join('')}</tbody></table></div>${rows.length?'':empty('No guests found','Start by entering people you want to invite.','guest')}`}
function seatingView(){let g=records('guests'),tables=records('tables'),seated=total(g.filter(x=>x.tableId&&x.rsvp==='Confirmed'),'party');return `${pageTitle('A seat for everyone','Seating planner','Assign confirmed guests to named tables, monitor table capacities, and avoid accidental overcrowding.',button(`${icon('plus',15)} New table`,'add-table','primary'))}<div class="section-note">To assign or move someone, use <b>Guests & RSVPs → Edit guest → Assigned table</b>. Only confirmed guests count towards capacity. Each party stays together in one table.</div><div class="col-3">${stat('Confirmed guests',plain(total(g.filter(x=>x.rsvp==='Confirmed'),'party')),'People expected to attend','users','sage')}${stat('Seated attendees',plain(seated),'Confirmed attendees assigned','layout','peach')}${stat('Available seats',plain(Math.max(0,total(tables,'capacity')-seated)),'Across all tables','check','purple')}</div><div class="table-seating">${tables.map(t=>{let people=g.filter(x=>x.tableId===t.id&&x.rsvp==='Confirmed'),count=total(people,'party');return `<div class="seat" data-drop-table="${esc(t.id)}"><div class="seat-header"><h3>${esc(t.name)}</h3><div>${button(icon('edit',13),'edit-table','small','data-id="'+esc(t.id)+'"')}${button(icon('trash',13),'delete-table','small danger','data-id="'+esc(t.id)+'"')}</div></div><div class="seat-circle" style="border-color:${count>safe(t.capacity)?'#d68a81':'#e3f0e5'}">${count}<span style="font-size:10px;color:#9aaca0">/${esc(t.capacity)}</span></div><div style="font-size:11px;color:#93a296;text-align:center;margin-bottom:10px">${count>t.capacity?'Over capacity!':'Assigned seats'}</div>${people.length?people.map(p=>`<div class="seat-name" draggable="true" data-guest-drag="${esc(p.id)}" title="Drag to another table">${esc(p.name)} ${p.party>1?'· '+p.party+' people':''}</div>`).join(''):'<div class="seat-name" style="text-align:center">No guests assigned yet</div>'}</div>`}).join('')}</div>${tables.length?'':empty('No tables yet','Create a table, then assign guests to it.','table')}<div class="panel" style="margin-top:17px" data-drop-table=""><div class="panel-head"><h3>Unseated confirmed guests</h3><span class="sub">Drag a guest card onto a table on desktop, or assign a table in Edit Guest.</span></div><div class="unseated">${g.filter(x=>x.rsvp==='Confirmed'&&!x.tableId).map(x=>`<span class="seat-name" draggable="true" data-guest-drag="${esc(x.id)}" title="Drag to a table" style="display:inline-block;margin:3px;padding:9px 11px;cursor:grab">${esc(x.name)} · ${x.party} ${x.party===1?'seat':'seats'}</span>`).join('')||'<span class="muted">Everyone who confirmed has a seat.</span>'}</div></div>`}

 if(state.events.some(x=>x.id==='ev-demo-2'&&x.name==='Summer Creative Summit'))state.events=state.events.filter(x=>x.id!=='ev-demo-2');
 if(!Array.isArray(state.payments)){
   state.payments=[];
   for(const b of state.budget){const paid=safe(b.paid),cost=safe(b.actual);
     if(paid>0)state.payments.push({id:id(),eventId:b.eventId,budgetId:b.id,label:b.item+' · deposit paid',amount:paid,paid,due:addDays(-18),reference:'Demo receipt',notes:'Imported from example budget'});
     if(cost-paid>0)state.payments.push({id:id(),eventId:b.eventId,budgetId:b.id,label:b.item+' · final balance',amount:cost-paid,paid:0,due:b.due||addDays(40),reference:'',notes:''});
   }
 }
 if(!Array.isArray(state.gifts))state.gifts=[
  {id:id(),eventId:'ev-demo-1',from:'Aunt Eleanor',item:'Hand-written wishes and dining set',received:addDays(-5),value:120,thankYou:'Sent',notes:'Lovely handwritten card'},
  {id:id(),eventId:'ev-demo-1',from:'Sophie Reed',item:'Coffee machine',received:addDays(-2),value:175,thankYou:'Not sent',notes:''},
  {id:id(),eventId:'ev-demo-1',from:'Oliver Graham',item:'Honeymoon contribution',received:addDays(-1),value:200,thankYou:'Not sent',notes:''}
 ];
 if(!Array.isArray(state.party))state.party=[
  {id:id(),eventId:'ev-demo-1',name:'Sophie Reed',role:'Maid of honor',phone:'',duty:'Welcome speech, bride support',status:'Ready',notes:''},
  {id:id(),eventId:'ev-demo-1',name:'James Turner',role:'Best man',phone:'',duty:'Rings and ceremony timing',status:'In progress',notes:''},
  {id:id(),eventId:'ev-demo-1',name:'Emma Parker',role:'Bridesmaid',phone:'',duty:'Getting-ready support',status:'Ready',notes:''}
 ];
 for(let g of state.guests){if(!g.invitation)g.invitation=g.rsvp==='Pending'?'Not sent':'Sent';if(!g.meal)g.meal=g.diet&&g.diet.toLowerCase().includes('vegan')?'Vegan':g.diet&&g.diet.toLowerCase().includes('vegetarian')?'Vegetarian':'Not selected';if(['Family','Friends','Work','VIP','Other'].includes(g.group)){g.group=g.group==='Family'?'Partner A family':g.group==='Friends'?'Mutual friends':g.group}}
 for(let v of state.vendors)if(!v.contract)v.contract=v.status==='Booked'?'Signed':'Not sent';

 for(let e of state.events)if(!e.type)e.type='Wedding';

function handleAction(btn,e){let a=btn.dataset.action;if(a==='close-backdrop'&&e.target!==btn)return;if(a==='close-modal'||a==='close-backdrop'){closeModal();return}if(a==='menu'){mobOpen=!mobOpen;document.getElementById('sidebar').classList.toggle('open',mobOpen);return}if(a==='navigate'){page=btn.dataset.page||'overview';search='';filter='All';mobOpen=false;render();window.scrollTo({top:0});return}if(a.startsWith('add-')){let type=a.slice(4);openForm(type);return}if(a.startsWith('edit-')){openForm(a.slice(5),btn.dataset.id);return}if(a.startsWith('delete-')){removeRecord(a.slice(7),btn.dataset.id);return}if(a==='complete-task'){let x=state.tasks.find(t=>t.id===btn.dataset.id);if(x){x.status='Done';save();render();toast('Task complete!')}return}if(a==='backup'){exportBackup();return}if(a==='xlsx'){exportExcel();return}if(a==='restore'){document.getElementById('file-import').click();return}if(a==='csv'){exportCSV(btn.dataset.section);return}if(a==='print'){window.print();return}if(a==='help'){showHelp();return}if(a==='clear-event'){clearEvent();return}if(a==='calendar-prev'||a==='calendar-next'||a==='calendar-today'){calCursor=a==='calendar-today'?new Date():new Date(calCursor.getFullYear(),calCursor.getMonth()+(a==='calendar-prev'?-1:1),1);render();return}}

document.addEventListener('submit',e=>{if(e.target.id==='record-form'){e.preventDefault();if(e.target.reportValidity())saveForm(e.target)}});
document.addEventListener('change',e=>{if(e.target.id==='event-switch'){state.selectedEventId=e.target.value;page='overview';search='';filter='All';save();render()}else if(e.target.id==='list-filter'){filter=e.target.value;render()}else if(e.target.id==='file-import'){importJSON(e.target.files?.[0]);e.target.value=''}});
document.addEventListener('input',e=>{if(e.target.id==='list-search'){let val=e.target.value,pos=e.target.selectionStart;search=val;const focus=document.activeElement===e.target;document.getElementById('content').innerHTML=({budget:budgetView,payments:paymentsView,guests:guestsView,vendors:vendorsView,tasks:tasksView,timeline:timelineView,party:partyView,gifts:giftsView})[page]?.()||'';if(focus){let el=document.getElementById('list-search');el?.focus();try{el?.setSelectionRange(pos,pos)}catch(_){}}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('modal-root').children.length)closeModal()});
load();upgradeWeddingState();if(!currentEvent()){state=seed();save()}render();if(!localStorage.getItem(KEY)){save();setTimeout(()=>toast('Explore the sample event, then personalize it in Settings.'),500)}
</script>
</body></html>
